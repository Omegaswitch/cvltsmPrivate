<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVLTSM</title>
<meta name="description" content="CVLTSM">
<meta name="theme-color" content="#08080a">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:title" content="CVLTSM">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="fonts/Valhalica-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- the world: one low-resolution framebuffer, upscaled by an integer factor -->
<div class="stage">
  <canvas id="scene" role="img"
    aria-label="Pixel art scene: a cloaked traveller walks endlessly through a dark snow-dusted Nordic forest with a lantern. Rune-carved sentinel pines glow crimson, crows cross the sky, and a colossal antlered figure watches from behind the treeline."></canvas>
</div>

<div class="post" aria-hidden="true"><div class="post__vignette"></div></div>

<div class="ui">

  <main class="hero">
    <!-- MANUFACTURER LOGO SLOT.
         Drop the artwork straight in here, e.g.
           <img src="img/manufacturer.svg" alt="Manufacturer">
         The empty placeholder frame disappears as soon as an image is present. -->
    <div class="hero__mfr" id="mfrLogo"></div>

    <!-- CVLTSM WORDMARK.
         Set in Valhalica for now. When the official logo artwork arrives,
         replace the contents of this h1 with:
           <img src="img/cvltsm.svg" alt="CVLTSM"> -->
    <h1 class="hero__title">CVLTSM</h1>

    <!-- Menu sits under the wordmark. Each link opens the slide-up section
         panel below; the scene behind it never moves. -->
    <nav class="nav" aria-label="Primary">
      <a href="#lore" data-section="lore">Lore</a>
      <a href="#expedition" data-section="expedition">Expedition</a>
      <a href="#archive" data-section="archive">Archive</a>
    </nav>

    <div class="hero__actions">
      <a class="ghost" href="#expedition" data-section="expedition"><span>Enter the wood</span></a>
    </div>
  </main>
</div>

<!-- SKOGLØP: the hidden run. Reached only by clicking the wordmark ten
     times; the hero lifts out of the way and the scene becomes the game. -->
<div class="game" id="game" hidden>
  <div class="game__hud">
    <p class="game__score"><span id="gameScore">0</span><small>m</small></p>
    <p class="game__best">best <span id="gameBest">0</span></p>
  </div>

  <div class="game__keys">
    <button type="button" class="game__key" id="btnJump">Jump</button>
    <button type="button" class="game__key" id="btnSlide">Slide</button>
  </div>

  <p class="game__hint">Space / &uarr; jump &middot; S / &darr; slide &middot; Esc leave</p>

  <div class="game__over" id="gameOver" hidden>
    <p class="game__overTitle">The wood took you</p>
    <p class="game__overScore"><span id="gameFinal">0</span> m</p>
    <div class="game__actions">
      <button type="button" class="ghost ghost--sm" id="gameAgain">Run again</button>
      <button type="button" class="ghost ghost--sm" id="gameLeave">Leave</button>
    </div>
  </div>
</div>

<!-- Slide-up section panel. Rises over a static background; content is
     fetched on open, with loading / empty / error states below. -->
<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" role="dialog" aria-modal="true"
         aria-labelledby="panelTitle" tabindex="-1" aria-hidden="true">
  <header class="panel__bar">
    <h2 class="panel__title" id="panelTitle"></h2>
    <button type="button" class="panel__close" id="panelClose" aria-label="Close section">
      <span aria-hidden="true">&#10005;</span>
    </button>
  </header>

  <div class="panel__body" id="panelBody" data-state="loading" aria-live="polite" aria-busy="true">

    <div class="state" data-for="loading">
      <div class="spinner" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="state__label">Opening</p>
    </div>

    <div class="state" data-for="empty">
      <p class="state__title">Nothing filed here yet</p>
      <p class="state__note">This section has no entries.</p>
    </div>

    <div class="state" data-for="error">
      <p class="state__title">Could not load this section</p>
      <p class="state__note" id="panelErrorNote"></p>
      <button type="button" class="ghost ghost--sm" id="panelRetry">Try again</button>
    </div>

    <div class="state" data-for="ready">
      <ul class="entries" id="panelEntries"></ul>
    </div>

  </div>
</section>

<!-- boot veil: lifts once every layer has been generated -->
<div class="boot" id="boot">
  <div class="boot__inner">
    <div class="boot__rune">&#5892;</div>
  </div>
</div>

<noscript>
  <div class="noscript">
    <h1>CVLTSM</h1>
    <p>This scene is generated pixel by pixel in the browser. Enable JavaScript to enter the wood.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
