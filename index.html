<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVLTSM</title>
<meta name="description" content="CVLTSM">
<meta name="theme-color" content="#08080a">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:title" content="CVLTSM">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="fonts/Valhalica-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- the world: one low-resolution framebuffer, upscaled by an integer factor -->
<div class="stage">
  <canvas id="scene" role="img"
    aria-label="Pixel art scene: a cloaked traveller walks endlessly through a dark snow-dusted Nordic forest with a lantern. Rune-carved sentinel pines glow crimson, crows cross the sky, and a colossal antlered figure watches from behind the treeline."></canvas>
</div>

<div class="post" aria-hidden="true"><div class="post__vignette"></div></div>

<div class="ui">

  <header class="topbar">
    <nav class="nav" aria-label="Primary">
      <a href="#lore">Lore</a>
      <a href="#expedition">Expedition</a>
      <a href="#archive">Archive</a>
    </nav>
  </header>

  <main class="hero">
    <!-- MANUFACTURER LOGO SLOT.
         Drop the artwork straight in here, e.g.
           <img src="img/manufacturer.svg" alt="Manufacturer">
         The empty placeholder frame disappears as soon as an image is present. -->
    <div class="hero__mfr" id="mfrLogo"></div>

    <!-- CVLTSM WORDMARK.
         Set in Valhalica for now. When the official logo artwork arrives,
         replace the contents of this h1 with:
           <img src="img/cvltsm.svg" alt="CVLTSM"> -->
    <h1 class="hero__title">CVLTSM</h1>

    <div class="hero__actions">
      <a class="ghost" href="#expedition"><span>Enter the wood</span></a>
    </div>
  </main>

  <footer class="footbar">
    <div class="controls">
      <button type="button" class="toggle" id="rain" aria-pressed="true">
        <span class="toggle__dot"></span>Rain
      </button>
      <button type="button" class="toggle" id="ambient" aria-pressed="false">
        <span class="toggle__dot"></span>Ambient fx
      </button>
    </div>
  </footer>
</div>

<!-- boot veil: lifts once every layer has been generated -->
<div class="boot" id="boot">
  <div class="boot__inner">
    <div class="boot__rune">&#5892;</div>
  </div>
</div>

<noscript>
  <div class="noscript">
    <h1>CVLTSM</h1>
    <p>This scene is generated pixel by pixel in the browser. Enable JavaScript to enter the wood.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
