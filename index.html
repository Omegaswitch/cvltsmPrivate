<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVLTSM</title>
<meta name="description" content="CVLTSM">
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">

<meta property="og:type" content="website">
<meta property="og:title" content="CVLTSM">
<meta name="twitter:card" content="summary_large_image">

<link rel="preload" href="fonts/Valhalica-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="scene">
  <canvas id="sigil" aria-hidden="true"></canvas>
  <div class="still" id="still" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
</main>

<div class="ui">

  <header class="crest">
    <!-- MANUFACTURER LOGO SLOT.
         Drop the artwork straight in here, e.g.
           <img src="img/manufacturer.svg" alt="Manufacturer">
         The slot keeps its width and draws nothing while it is empty. -->
    <div class="crest__mfr" id="mfrLogo"></div>

    <!-- CVLTSM WORDMARK. Set in Valhalica for now. When the official logo
         artwork arrives, replace the contents of this h1 with:
           <img src="img/cvltsm.svg" alt="CVLTSM"> -->
    <h1 class="crest__mark">CVLTSM</h1>
  </header>

  <!-- Each section is a glyph on the sigil. data-rune is the glyph's index
       around the ring, and hovering a section lights that glyph. -->
  <nav class="nav" aria-label="Primary">
    <a class="nav__item" href="#lore" data-section="lore" data-rune="0">
      <span class="nav__numeral">I</span><span class="nav__label">Lore</span>
    </a>
    <a class="nav__item" href="#expedition" data-section="expedition" data-rune="4">
      <span class="nav__numeral">II</span><span class="nav__label">Expedition</span>
    </a>
    <a class="nav__item" href="#archive" data-section="archive" data-rune="8">
      <span class="nav__numeral">III</span><span class="nav__label">Archive</span>
    </a>
    <a class="nav__item" href="#rites" data-section="rites" data-rune="12">
      <span class="nav__numeral">IV</span><span class="nav__label">Rites</span>
    </a>
  </nav>
</div>

<!-- Section panel. Rises over the sigil, which keeps running untouched behind it. -->
<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" role="dialog" aria-modal="true"
         aria-labelledby="panelTitle" tabindex="-1" aria-hidden="true">
  <header class="panel__bar">
    <h2 class="panel__title" id="panelTitle"></h2>
    <button type="button" class="panel__close" id="panelClose" aria-label="Close section">
      <span aria-hidden="true">&#10005;</span>
    </button>
  </header>

  <div class="panel__body" id="panelBody" data-state="loading" aria-live="polite" aria-busy="true">
    <div class="state" data-for="loading">
      <div class="spinner" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="state__label">Opening</p>
    </div>
    <div class="state" data-for="empty">
      <p class="state__title">Nothing filed here yet</p>
      <p class="state__note">This section has no entries.</p>
    </div>
    <div class="state" data-for="error">
      <p class="state__title">Could not load this section</p>
      <p class="state__note" id="panelErrorNote"></p>
      <button type="button" class="btn" id="panelRetry">Try again</button>
    </div>
    <div class="state" data-for="ready">
      <ul class="entries" id="panelEntries"></ul>
    </div>
  </div>
</section>

<noscript>
  <div class="noscript">
    <h1>CVLTSM</h1>
    <p>This page is drawn in the browser. Enable JavaScript to see it.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
